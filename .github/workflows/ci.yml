# Integración continua: en cada PR y en cada push a main se comprueba que el front y el back
# compilan y pasan los tests. El despliegue es a mano en el servidor (ver infra/DESPLIEGUE.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (backend)
        run: npm run lint

      - name: Build (backend y frontend)
        run: npm run build

      - name: Tests (unitarios y e2e)
        run: npm test

  # Construye y levanta las imágenes igual que en el servidor, y comprueba que la web
  # y la API responden a través de nginx. Así no hace falta Docker en el PC.
  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar y esperar a que estén sanas
        run: docker compose up -d --wait --wait-timeout 90

      - name: Comprobar web y API a través de nginx
        run: |
          set -eux
          curl -fsS http://localhost:8080/ | grep -q 'Arkaitz Galisteo</h1>'
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsSI http://localhost:8080/ | grep -qi '^x-content-type-options: nosniff'
          # Los archivos con hash se cachean un año y salen comprimidos
          asset=$(curl -fsS http://localhost:8080/ | grep -o 'main-[A-Z0-9]*\.js' | head -1)
          curl -fsSI "http://localhost:8080/$asset" | grep -qi '^cache-control: max-age=31536000'
          curl -fsSI -H 'Accept-Encoding: gzip' "http://localhost:8080/$asset" | grep -qi '^content-encoding: gzip'
          # La API no está publicada en el host
          ! curl -fsS --max-time 3 http://localhost:3000/api/health

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs

      - name: Parar
        if: always()
        run: docker compose down
