# nginx de la web: sirve el Angular prerenderizado y reenvía /api al contenedor de la API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # --- Compresión ---
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # --- Cabeceras de seguridad ---
  # Ojo: un add_header dentro de un location anula estos. Para la caché se usa "expires",
  # que no los pisa.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # --- API ---
  # El nombre "api" se resuelve con el DNS de Docker en cada petición (y no solo al arrancar),
  # así nginx no se queda con una IP vieja si se recrea el contenedor de la API, y la web
  # arranca aunque la API aún no esté levantada.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Archivos con hash en el nombre (main-XXXX.js, styles-XXXX.css…): caché de un año ---
  # (la expresión va entre comillas porque lleva llaves)
  location ~* "-[A-Z0-9]{8}\.(?:js|css)$" {
    expires 1y;
    try_files $uri =404;
  }

  # --- HTML: siempre se revalida, para que un despliegue nuevo se vea al momento ---
  location / {
    expires -1;
    try_files $uri $uri/index.html /index.html;
  }
}
