<article class="prose">
  <h1>Contacto</h1>
  @if (email) {
    <p>
      La forma más rápida de hablar conmigo es por correo:
      <a [href]="'mailto:' + email">{{ email }}</a>
    </p>
  } @else {
    <p class="muted">Pendiente: correo de contacto.</p>
  }
  <p>También me encuentras en:</p>
  <ul>
    @for (link of links; track link.url) {
      <li>
        <a [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
      </li>
    }
  </ul>
</article>
